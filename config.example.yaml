# Copia questo file come config.yaml. Il file config.yaml è escluso da Git.
argo:
  # browser è la modalità più semplice; api richiede un token ancora valido.
  mode: browser
  school_code: "INSERISCI_CODICE_SCUOLA"
  username: "INSERISCI_NOME_UTENTE"
  password: "INSERISCI_PASSWORD"
  browser_profile: .argo-browser-profile
  remember_me: true
  headless: false
  # har_file: /private/path/to/recent.har
  # token_file: /private/path/to/current-token.txt

storage:
  database: data/argo_monitoring.db
  # I PDF vengono caricati su Drive. Lascia false per evitare un archivio locale crescente.
  keep_local_documents: false
  documents_dir: data/documents

email:
  smtp_host: smtp.gmail.com
  smtp_port: 465
  sender: "tuo.indirizzo@example.com"
  app_password: "INSERISCI_PASSWORD_PER_APP_EMAIL"
  test_mode: true
  dev_recipients:
    - "tuo.indirizzo@example.com"
  daily_recipients:
    - "famiglia@example.com"
  bacheca_recipients:
    - "famiglia@example.com"

notifications:
  days_forward: 17
  max_daily_items: 12
  bacheca_recent_items: 10
  bacheca_weekly_day: domenica
  send_daily: true
  send_bacheca: true

files:
  schedule: data/schedule.csv
  manual_events: data/manual_events.csv
  email_header: assets/email_header.png

google_drive:
  folder_id: "INSERISCI_ID_CARTELLA_GOOGLE_DRIVE"
  oauth_keys_file: ~/.google-identities/client_secret.json
  token_file: ~/.google-identities/google-identity.json
  # Con true, chiunque riceva il collegamento potrà leggere il documento.
  share_with_link: false
